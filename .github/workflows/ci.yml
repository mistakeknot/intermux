name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

      # The fleet sweep is Python, so a Go-only CI would ship it untested while
      # reporting green. It runs on Linux here and on macOS in practice, and its
      # process-resolution branch differs between the two — which is precisely
      # the split that hid the /proc-only bug this repo fixed in 0.1.10.
      - name: Fleet sweep tests
        run: python3 scripts/test_fleet_version_skew.py
